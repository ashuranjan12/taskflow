<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">

  <div class="container">

    <div class="top-header">
      <div>
        <h1>TaskFlow</h1>
        <p>Manage your tasks with focus and clarity</p>
      </div>

      <button id="themeBtn" class="theme-btn">☀️ Light</button>
    </div>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="Write your task..." />

      <select id="priorityInput">
        <option value="">Priority</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>

      <select id="categoryInput">
        <option value="">Category</option>
        <option value="Work">Work</option>
        <option value="Study">Study</option>
        <option value="Personal">Personal</option>
      </select>

      <input type="date" id="dateInput" />

      <button type="submit" id="submitBtn">Add Task</button>
    </form>

    <div class="stats">
      <div class="stat-card">
        <h2 id="totalTasks">0</h2>
        <p>Total</p>
      </div>

      <div class="stat-card">
        <h2 id="pendingTasks">0</h2>
        <p>Pending</p>
      </div>

      <div class="stat-card">
        <h2 id="completedTasks">0</h2>
        <p>Completed</p>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search tasks..." />

      <select id="sortInput">
        <option value="">Sort Tasks</option>
        <option value="high">High Priority First</option>
        <option value="latest">Latest Date</option>
        <option value="oldest">Oldest Date</option>
      </select>
    </div>

    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <section id="taskList" class="task-list">

      <p class="empty-message">No tasks added yet.</p>

    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
